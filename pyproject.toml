[project]
name = "lgh"
version = "0.1.0"
description = "Laya Guardrail Harness — local policy enforcement between a coding agent and its tools."
readme = "README.md"
license = "MIT"
authors = [{ name = "Erik Morén" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
laya = ["laya>=0.1"]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
]

[project.scripts]
lgh = "lgh.cli:main"

[project.urls]
Homepage = "https://github.com/NandhaKishorM/laya"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lgh"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "laya: tests that require a running Laya daemon",
]

[tool.uv]
default-groups = []
