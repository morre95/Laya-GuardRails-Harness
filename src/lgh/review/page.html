<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LGH review</title>
  <style>
    :root {
      --bg: #14110e;
      --bg-2: #1c1813;
      --ink: #f3ead7;
      --muted: #9a8d78;
      --line: #3a3228;
      --paper: #221c16;
      --amber: #e0a45a;
      --mint: #8fbf9a;
      --rose: #d9786a;
      --sky: #7ea6c4;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font: 14px/1.45 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      background: var(--bg);
      color: var(--ink);
    }
    code, .mono, kbd {
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    kbd {
      border: 1px solid var(--line);
      padding: 0 5px;
      border-radius: 3px;
      font-size: 11px;
      color: var(--muted);
    }
    #app { display: grid; grid-template-columns: 300px 1fr; height: 100%; }
    aside {
      border-right: 1px solid var(--line);
      background: var(--bg-2);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .brand { padding: 18px 16px 10px; }
    .brand h1 { margin: 0; font-size: 18px; letter-spacing: 0.04em; }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 0 0;
      color: var(--ink);
      font-size: 13px;
      cursor: pointer;
    }
    .toggle[hidden] { display: none; }
    .toggle input { accent-color: var(--mint); }
    .counts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 16px 12px; }
    .counts button {
      background: var(--paper);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      text-align: left;
      cursor: pointer;
    }
    .counts button.on { border-color: var(--amber); color: var(--amber); }
    .counts strong { display: block; font-size: 16px; }
    .list { overflow: auto; flex: 1; border-top: 1px solid var(--line); }
    .list-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      position: sticky;
      top: 0;
      background: var(--bg-2);
      z-index: 1;
    }
    .item {
      display: grid;
      grid-template-columns: 22px 1fr;
      align-items: start;
      gap: 8px;
      width: 100%;
      border-bottom: 1px solid var(--line);
      padding: 10px 14px;
    }
    .item:hover { background: #2a231c; }
    .item.on { background: #2f261c; box-shadow: inset 3px 0 0 var(--amber); }
    .item.picked { background: #241e16; }
    .item.picked.on { background: #2f261c; }
    .item .pick { margin-top: 3px; accent-color: var(--amber); }
    .item .open {
      display: block; width: 100%; text-align: left;
      background: transparent; color: inherit;
      border: 0; padding: 0; cursor: pointer; font: inherit;
    }
    .item .sum { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item .meta { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .sort { display: flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
    .sort button {
      font: inherit; font-size: 11px;
      background: transparent; color: var(--muted);
      border: 0; padding: 2px 8px; cursor: pointer;
    }
    .sort button.on { background: var(--amber); color: var(--bg); }
    .risk { font-weight: 600; margin-right: 4px; }
    .risk.high { color: var(--rose); }
    .risk.mid { color: var(--amber); }
    main { overflow: auto; padding: 22px 28px 96px; }
    .empty { color: var(--muted); max-width: 36em; }
    aside, main, .item .open, .context-grid > section, dl.kv dd { min-width: 0; }
    .context-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 18px; }
    .context-grid h2 { font-size: 18px; margin: 0 0 10px; color: var(--amber); }
    .source-text { white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0 16px; }
    details { margin-bottom: 14px; }
    summary { cursor: pointer; color: var(--sky); }
    .seg label { flex: 1 1 180px; }
    .seg small { display: block; font-size: 12px; margin-top: 5px; }
    .seg label:focus-within { outline: 2px solid var(--sky); outline-offset: 2px; }
    .quality-box { border: 1px solid var(--line); padding: 14px; margin-bottom: 20px; border-radius: 6px; }
    .quality-box textarea { display: block; width: 100%; min-height: 4em; margin: 8px 0;
      background: var(--bg); color: var(--ink); border: 1px solid var(--line); font: inherit; padding: 8px; }
    .quality-box button { font: inherit; padding: 8px 12px; background: var(--paper); color: var(--amber);
      border: 1px solid var(--amber); border-radius: 4px; cursor: pointer; }
    .quality-error { color: var(--rose); }
    @media (max-width: 1000px) { .context-grid { grid-template-columns: 1fr; } }
    @media (max-width: 700px) {
      #app { grid-template-columns: 1fr; height: auto; }
      aside { max-height: 35vh; }
      main { padding: 18px 16px 40px; }
      dl.kv { grid-template-columns: 80px 1fr; }
    }
    .cmd {
      background: #0e0c0a;
      border: 1px solid var(--line);
      padding: 12px 14px;
      border-radius: 6px;
      white-space: pre-wrap;
      word-break: break-word;
      margin: 12px 0 16px;
    }
    .facts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .chip {
      border: 1px solid var(--line);
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--muted);
    }
    .chip.laya { color: var(--sky); }
    dl.kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 14px; margin: 0 0 22px; }
    dl.kv dt { color: var(--muted); }
    dl.kv dd { margin: 0; }
    fieldset {
      border: 1px solid var(--line);
      border-radius: 8px;
      margin: 0 0 12px;
      padding: 12px 14px;
      background: var(--paper);
    }
    legend { color: var(--amber); padding: 0 6px; }
    .hint { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
    .seg { display: flex; flex-wrap: wrap; gap: 6px; }
    .seg label {
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 6px 10px;
      cursor: pointer;
    }
    .seg input { display: inline-block; accent-color: var(--amber); }
    .seg input:checked + span { color: var(--bg); }
    .seg label:has(input:checked) { background: var(--amber); border-color: var(--amber); color: var(--bg); }
    .noul { display: grid; grid-template-columns: 1fr 52px; gap: 10px; align-items: center; }
    input[type=range] { width: 100%; }
    .noul output { font-variant-numeric: tabular-nums; }
    footer.bar {
      position: sticky; bottom: 0;
      display: flex; gap: 10px; align-items: center;
      padding-top: 16px; background: linear-gradient(transparent, var(--bg) 28%);
    }
    footer.bar button {
      font: inherit;
      padding: 9px 14px;
      border-radius: 6px;
      border: 1px solid var(--line);
      cursor: pointer;
    }
    .save { background: var(--mint); color: #102016; border-color: var(--mint); }
    .skip { background: transparent; color: var(--ink); }
    .err { color: var(--rose); min-height: 1.2em; }
    .warn {
      border: 1px solid #6a4a28;
      background: #2a1d10;
      color: var(--amber);
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 16px;
    }
    .proposal {
      border: 1px solid #3a5a48;
      background: #142018;
      color: var(--mint);
      padding: 10px 12px;
      border-radius: 6px;
      margin: 0 0 16px;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div id="app">
    <aside>
      <div class="brand">
        <h1>LGH review</h1>
        <p id="brand-copy">Human labels for Laya. Model guesses are hints only.</p>
        <label class="toggle" id="teacher-toggle" hidden>
          <input type="checkbox" id="teacher-on" checked>
          Ask LLM
        </label>
      </div>
      <div class="counts" id="counts"></div>
      <div class="list" id="list"></div>
    </aside>
    <main id="main"><p class="empty">Loading traces…</p></main>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    let items = [];
    let filter = "unlabeled";
    let sortBy = "time";
    try { sortBy = localStorage.getItem("lgh-review-sort") || "time"; } catch (e) { console.warn("sort preference unavailable", e); }
    let currentId = null;
    let form = null;
    let teacherAvailable = false;
    let proposeEnabled = false;
    const selected = new Set();
    let lastPickIndex = null;

    const CHOICE = {
      task_alignment: ["aligned", "supporting", "unclear", "outside_scope"],
      reversibility: ["trivial", "recoverable", "difficult", "irreversible"],
      handling: ["allow", "verify", "replan", "escalate"],
    };
    const NOUL = ["destructive_risk", "sensitive_resource", "external_impact", "verification_needed"];

    async function api(path, opts) {
      const res = await fetch(path, opts);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    function noulVal(v) {
      if (v == null) return 0;
      return Number(v).toFixed(2);
    }

    function renderCounts(counts) {
      const keys = [
        ["unlabeled", "Unlabeled"],
        ["labeled", "Labeled"],
        ["skipped", "Skipped"],
        ["no_state", "No state"],
        ["insufficient_context", "Insufficient context"],
      ];
      $("counts").innerHTML = keys.map(([k, label]) =>
        `<button data-f="${k}" class="${filter === k ? "on" : ""}"><strong>${counts[k] || 0}</strong>${label}</button>`
      ).join("");
      $("counts").onclick = (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        filter = b.dataset.f;
        lastPickIndex = null;
        renderList();
        renderCounts(counts);
      };
    }

    function filtered() {
      const rows = items.filter((it) => it.status === filter);
      if (sortBy === "risk") {
        rows.sort((a, b) => b.risk - a.risk || a.timestamp.localeCompare(b.timestamp));
      }
      return rows;
    }

    function setSort(value) {
      sortBy = value;
      try { localStorage.setItem("lgh-review-sort", value); } catch (e) { console.warn("sort preference not saved", e); }
      lastPickIndex = null;
      renderList();
    }

    function riskBadge(it) {
      if (!it.risk) return "";
      const level = it.risk >= 5 ? "high" : it.risk >= 3 ? "mid" : "";
      return `<span class="risk ${level}" title="${escapeHtml(it.riskReasons.join(" "))}">risk ${it.risk}</span> · `;
    }

    function renderList() {
      const rows = filtered();
      const visibleIds = rows.filter((it) => it.hasState).map((it) => it.traceId);
      const allOn = visibleIds.length > 0 && visibleIds.every((id) => selected.has(id));
      const picks = [...selected].filter((id) => items.some((it) => it.traceId === id)).length;
      $("list").innerHTML = `
        <div class="list-bar">
          <label class="toggle" style="margin:0">
            <input type="checkbox" id="select-visible" ${allOn ? "checked" : ""} ${visibleIds.length ? "" : "disabled"}>
            Select visible
          </label>
          <span>${picks ? picks + " selected" : "Shift-click range"}</span>
          <div class="sort" id="sort">
            <button type="button" data-sort="time" class="${sortBy === "time" ? "on" : ""}">Time</button>
            <button type="button" data-sort="risk" class="${sortBy === "risk" ? "on" : ""}">Risk</button>
          </div>
        </div>
      ` + (rows.map((it) => `
        <div class="item ${it.traceId === currentId ? "on" : ""} ${selected.has(it.traceId) ? "picked" : ""}" data-id="${it.traceId}">
          <input type="checkbox" class="pick" data-id="${it.traceId}"
            ${selected.has(it.traceId) ? "checked" : ""} ${it.hasState ? "" : "disabled"}>
          <button type="button" class="open" data-id="${it.traceId}">
            <div class="sum mono">${escapeHtml(it.summary)}</div>
            <div class="meta mono">${riskBadge(it)}${it.decision} · ${it.timestamp.slice(0, 19)}</div>
          </button>
        </div>
      `).join("") || `<p class="empty" style="padding:16px">Nothing in ${filter}.</p>`);
      $("sort").onclick = (e) => {
        const b = e.target.closest("button");
        if (b && b.dataset.sort !== sortBy) setSort(b.dataset.sort);
      };
      const vis = $("select-visible");
      if (vis) vis.onchange = () => {
        if (vis.checked) visibleIds.forEach((id) => selected.add(id));
        else visibleIds.forEach((id) => selected.delete(id));
        lastPickIndex = null;
        renderList();
        updateBulkButtons();
      };
      $("list").onclick = (e) => {
        const pick = e.target.closest(".pick");
        if (pick) {
          e.stopPropagation();
          togglePick(pick.dataset.id, { range: e.shiftKey });
          return;
        }
        const b = e.target.closest(".open, .item");
        if (b && b.dataset.id) openTrace(b.dataset.id);
      };
      updateBulkButtons();
    }

    function togglePick(id, { range } = {}) {
      const row = items.find((it) => it.traceId === id);
      if (!row || !row.hasState) return;
      const rows = filtered();
      const idx = rows.findIndex((it) => it.traceId === id);
      if (range && lastPickIndex != null && idx >= 0) {
        const lo = Math.min(lastPickIndex, idx);
        const hi = Math.max(lastPickIndex, idx);
        for (let i = lo; i <= hi; i++) {
          if (rows[i].hasState) selected.add(rows[i].traceId);
        }
      } else if (selected.has(id)) {
        selected.delete(id);
      } else {
        selected.add(id);
      }
      if (idx >= 0) lastPickIndex = idx;
      renderList();
    }

    function idsToApply() {
      const ids = [...selected].filter((id) => {
        const it = items.find((row) => row.traceId === id);
        return it && it.hasState;
      });
      if (ids.length) return ids;
      return currentId ? [currentId] : [];
    }

    function updateBulkButtons() {
      const n = idsToApply().length;
      const save = document.querySelector("#labelform button.save");
      const skip = $("skip");
      const hint = $("bulk-hint");
      if (save) {
        save.innerHTML = n > 1 ? `Save ${n}` : `Save <kbd>enter</kbd>`;
      }
      if (skip) {
        skip.innerHTML = n > 1 ? `Skip ${n}` : `Skip <kbd>s</kbd>`;
      }
      if (hint) {
        hint.hidden = n <= 1;
        hint.textContent = n > 1
          ? `Saving or skipping applies these values to ${n} selected traces.`
          : "";
      }
    }

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    function layaChip(q, assessment) {
      if (!assessment) return "";
      const map = {
        task_alignment: assessment.taskAlignment,
        reversibility: assessment.reversibility,
        handling: assessment.handling,
        destructive_risk: assessment.destructiveRisk,
        sensitive_resource: assessment.sensitiveResource,
        external_impact: assessment.externalImpact,
        verification_needed: assessment.verificationNeeded,
      };
      const v = map[q];
      if (v == null) return "";
      if (typeof v === "object") {
        return `<span class="chip laya">Laya ${escapeHtml(v.value)} ${Number(v.confidence).toFixed(2)}</span>`;
      }
      return `<span class="chip laya">Laya ${Number(v).toFixed(2)}</span>`;
    }

    function choiceField(key, spec, selected) {
      const opts = CHOICE[key];
      return `
        <fieldset>
          <legend>${key}</legend>
          <p class="hint">${escapeHtml(spec.instructions || "")}</p>
          <div class="seg">
            ${opts.map((o) => `
              <label><input type="radio" name="${key}" value="${o}" ${selected === o ? "checked" : ""}>
              <span>${o}</span>
              <small>${escapeHtml(spec.criteria?.[o] || "")}</small></label>
            `).join("")}
          </div>
        </fieldset>`;
    }

    function noulField(key, spec, value) {
          const v = value == null ? 0.5 : Number(value);
      return `
        <fieldset>
          <legend>${key}</legend>
          <p class="hint">${escapeHtml(spec.instructions || "")}</p>
          <div class="noul">
            <input type="range" name="${key}" min="0" max="1" step="0.05" value="${v}">
            <output>${noulVal(v)}</output>
          </div>
        </fieldset>`;
    }

    function renderContext(data) {
      const state = data.state;
      const source = data.reviewContext;
      const instructions = source?.instructions;
      const messages = instructions?.messages || [];
      const command = source?.command ?? state.action.command ?? state.action.target ?? "";
      const warnings = [];
      if (!source) warnings.push("Older trace: only the saved model input is available. Original instructions and unshortened command were not stored.");
      if (!state.goal) warnings.push("The model input has no user goal.");
      if (state.goal.includes("tool_result")) warnings.push("The saved goal may be a tool result instead of a user instruction.");
      if (instructions?.history_truncated) warnings.push("Earlier user history is missing: only a recent window was captured. This is not a confirmed active-task boundary.");
      if (instructions?.text_truncated || source?.truncated_fields?.length) warnings.push("Some source text was shortened when captured. Missing text cannot be expanded here.");
      if (command !== (state.action.command ?? state.action.target ?? "") || state.goal.includes("…") || command.endsWith("…")) {
        warnings.push("The model input is shortened. Compare it below before labeling.");
      }
      return `
        ${warnings.map((text) => `<p class="warn">${escapeHtml(text)}</p>`).join("")}
        <div class="context-grid">
          <section aria-labelledby="instructions-heading">
            <h2 id="instructions-heading">User instructions</h2>
            <p class="hint">Captured before this action, oldest to newest. User text is separate from the agent's plan.</p>
            ${messages.length ? messages.map((text, i) => `
              <details open><summary>${messages.length === 1 ? "User instruction" : i === messages.length - 1 ? "Latest user instruction" : "Earlier user instruction " + (i + 1)}</summary>
              <p class="source-text">${escapeHtml(text)}</p></details>
            `).join("") : `<p class="hint">${source?.instructions ? "No user instruction was captured." : "Source user messages unavailable; saved goal shown below."}</p>`}
            <details ${messages.length ? "" : "open"}><summary>Goal in Laya's input</summary>
              <p class="source-text">${escapeHtml(state.goal || "(no goal)")}</p>
            </details>
          </section>
          <section aria-labelledby="action-heading">
            <h2 id="action-heading">Proposed action</h2>
            <pre class="cmd mono">${escapeHtml(command)}</pre>
            <details><summary>Agent plan (not a user instruction)</summary>
              <p class="source-text">${escapeHtml(source?.plan ?? state.plan ?? "No plan was captured.")}</p>
            </details>
            <details><summary>Previous actions and repository</summary>
              <dl class="kv">
                <dt>repo</dt><dd>${escapeHtml(state.repo.branch || "?")} ${state.repo.dirty ? "dirty" : "clean"} · ${escapeHtml((state.repo.changed || []).join(", ") || "no changed files")}</dd>
                <dt>recent</dt><dd class="source-text">${escapeHtml((state.recent || []).join("\n") || "No earlier actions in the model input.")}</dd>
              </dl>
            </details>
          </section>
        </div>
        <details><summary>Saved Laya input (inference and export format)</summary>
          <p class="hint">The input snapshot is stored even when a hard rule handles the action.</p>
          <pre class="cmd mono">${escapeHtml(JSON.stringify(state, null, 2))}</pre>
        </details>
        <p class="hint">Label from the saved model input. If your answers require missing context, mark this case as insufficient context instead of guessing or choosing unclear.</p>
        <details class="quality-box" ${data.quality ? "open" : ""}>
          <summary>Cannot assess — missing or incorrect context</summary>
          <p>Exclude this case from future dataset exports without changing the trace. This applies only to the open case, even when other rows are selected.</p>
          <form id="quality-form">
            <label for="quality-reason">What information is missing or incorrect?</label>
            <textarea id="quality-reason" required maxlength="1000">${escapeHtml(data.quality?.reason || "")}</textarea>
            <button type="submit">Mark insufficient context</button>
            <p class="quality-error" id="quality-error" role="status"></p>
          </form>
          ${data.quality ? `<p class="hint">Currently excluded. Only save a complete label below if the saved input is sufficient; that restores the case.</p>` : ""}
        </details>`;
    }

    function renderDetail(data) {
      const q = data.questions || {};
      const lab = data.label || {};
      const state = data.state;
      form = null;
      if (!state) {
        $("main").innerHTML = `
          <div class="warn">This trace has no stored LayaState. It was collected before the review UI. Skip it; only new hook events can be labeled.</div>
          <p class="mono">${data.traceId}</p>
          <footer class="bar"><button class="skip" id="skip">Skip</button></footer>`;
        $("skip").onclick = skipCurrent;
        return;
      }
      $("main").innerHTML = `
        <p class="mono" style="color:var(--muted)">${data.traceId}</p>
        <div class="facts">
          <span class="chip">${escapeHtml(data.decision)}</span>
          <span class="chip">${escapeHtml(state.environment)}</span>
          <span class="chip">${escapeHtml(state.action.tool)} ${escapeHtml(state.action.operation)}</span>
          ${data.outcome ? `<span class="chip">exit ${data.outcome.exitCode ?? "?"}</span>` : ""}
          ${data.rules?.length ? `<span class="chip">rules ${escapeHtml(data.rules.join(", "))}</span>` : ""}
        </div>
        ${renderContext(data)}
        <p class="hint">Do not copy Laya’s guess. Label what <em>you</em> would decide.</p>
        ${layaChip("handling", data.laya)}
        ${proposeEnabled && data.status === "unlabeled" ? `<p class="proposal" id="proposal">Asking teacher…</p>` : `<p class="proposal" id="proposal" hidden></p>`}
        <p class="warn" id="bulk-hint" hidden></p>
        <form id="labelform">
          ${choiceField("task_alignment", q.task_alignment || {}, lab.task_alignment)}
          ${noulField("destructive_risk", q.destructive_risk || {}, lab.destructive_risk)}
          ${noulField("sensitive_resource", q.sensitive_resource || {}, lab.sensitive_resource)}
          ${noulField("external_impact", q.external_impact || {}, lab.external_impact)}
          ${choiceField("reversibility", q.reversibility || {}, lab.reversibility)}
          ${noulField("verification_needed", q.verification_needed || {}, lab.verification_needed)}
          ${choiceField("handling", q.handling || {}, lab.handling)}
          <p class="err" id="err"></p>
          <footer class="bar">
            <button type="submit" class="save">Save <kbd>enter</kbd></button>
            <button type="button" class="skip" id="skip">Skip <kbd>s</kbd></button>
            <span class="hint">j / k next in list</span>
          </footer>
        </form>
      `;
      form = $("labelform");
      form.querySelectorAll("input[type=range]").forEach((el) => {
        el.addEventListener("input", () => { el.parentElement.querySelector("output").textContent = noulVal(el.value); });
      });
      form.onsubmit = (e) => { e.preventDefault(); saveCurrent(); };
      $("skip").onclick = skipCurrent;
      $("quality-form").onsubmit = async (event) => {
        event.preventDefault();
        const id = currentId;
        try {
          await api("/api/quality", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ trace_id: id, reason: $("quality-reason").value }),
          });
          selected.delete(id);
          cancelProposal();
          await reload(true);
        } catch (error) {
          $("quality-error").textContent = error.message;
        }
      };
      updateBulkButtons();
    }

    function readForm() {
      const fd = new FormData(form);
      const get = (k) => fd.get(k);
      return {
        source: "human",
        task_alignment: get("task_alignment"),
        destructive_risk: Number(get("destructive_risk")),
        sensitive_resource: Number(get("sensitive_resource")),
        external_impact: Number(get("external_impact")),
        reversibility: get("reversibility"),
        verification_needed: Number(get("verification_needed")),
        handling: get("handling"),
      };
    }

    async function saveCurrent() {
      const err = $("err");
      const ids = idsToApply();
      try {
        const body = { ...readForm() };
        if (ids.length === 1) body.trace_id = ids[0];
        else body.trace_ids = ids;
        await api("/api/labels", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        ids.forEach((id) => selected.delete(id));
        await reload(true);
      } catch (e) {
        if (err) err.textContent = e.message;
      }
    }

    async function skipCurrent() {
      const ids = idsToApply();
      const body = ids.length === 1 ? { trace_id: ids[0] } : { trace_ids: ids };
      await api("/api/skip", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      ids.forEach((id) => selected.delete(id));
      await reload(true);
    }

    function nextAfter(id) {
      const rows = filtered();
      const idx = rows.findIndex((r) => r.traceId === id);
      if (idx >= 0 && idx < rows.length - 1) return rows[idx + 1].traceId;
      if (rows.length) return rows[0].traceId;
      return null;
    }

    function applyProposal(p) {
      if (!form) return;
      for (const key of Object.keys(CHOICE)) {
        const input = form.querySelector(`input[name="${key}"][value="${p[key]}"]`);
        if (input) input.checked = true;
      }
      for (const key of NOUL) {
        const input = form.querySelector(`input[name="${key}"]`);
        if (input && p[key] != null) {
          input.value = p[key];
          const out = input.parentElement.querySelector("output");
          if (out) out.textContent = noulVal(p[key]);
        }
      }
      const banner = $("proposal");
      if (banner) {
        banner.hidden = false;
        banner.innerHTML = `<strong>${escapeHtml(p.model || "teacher")}</strong> suggested these values. Edit before you save.`
          + (p.reason ? `<br>${escapeHtml(p.reason)}` : "");
      }
    }

    let proposalAbort = null;

    function cancelProposal() {
      if (proposalAbort) {
        proposalAbort.abort();
        proposalAbort = null;
      }
    }

    async function fetchProposal(id) {
      cancelProposal();
      const controller = new AbortController();
      proposalAbort = controller;
      const err = $("err");
      const banner = $("proposal");
      try {
        const proposal = await api("/api/propose", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ trace_id: id }),
          signal: controller.signal,
        });
        if (currentId !== id || controller.signal.aborted) return;
        applyProposal(proposal);
      } catch (e) {
        if (e.name === "AbortError" || controller.signal.aborted) return;
        if (banner) {
          banner.hidden = false;
          banner.textContent = "Teacher failed: " + e.message;
        }
        if (err) err.textContent = e.message;
      } finally {
        if (proposalAbort === controller) proposalAbort = null;
      }
    }

    async function openTrace(id) {
      cancelProposal();
      currentId = id;
      renderList();
      const data = await api("/api/traces/" + encodeURIComponent(id));
      renderDetail(data);
      if (proposeEnabled && data.status === "unlabeled" && data.state) {
        await fetchProposal(id);
      }
    }

    async function reload(advance) {
      const prev = currentId;
      const data = await api("/api/queue");
      items = data.items;
      renderCounts(data.counts);
      renderList();
      let id = prev;
      if (advance) id = nextAfter(prev);
      if (!id || !items.some((it) => it.traceId === id && it.status === filter)) {
        const rows = filtered();
        id = rows[0] && rows[0].traceId;
      }
      if (id) await openTrace(id);
      else { form = null; currentId = null; $("main").innerHTML = `<p class="empty">No traces in ${filter}. New actions appear here after the daemon+hooks run.</p>`; }
    }

    function hideProposal() {
      const banner = $("proposal");
      if (banner) {
        banner.hidden = true;
        banner.textContent = "";
      }
    }

    async function setProposeEnabled(on) {
      proposeEnabled = Boolean(on);
      if (!proposeEnabled) {
        cancelProposal();
        hideProposal();
        return;
      }
      const item = items.find((it) => it.traceId === currentId);
      if (item && item.status === "unlabeled" && item.hasState) {
        const banner = $("proposal");
        if (banner) {
          banner.hidden = false;
          banner.textContent = "Asking teacher…";
        }
        await fetchProposal(currentId);
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.target.matches("input, textarea, button")) return;
      if (e.key === "s" && !e.metaKey && !e.ctrlKey) { e.preventDefault(); skipCurrent(); }
      if (e.key === "x" && !e.metaKey && !e.ctrlKey && currentId) {
        e.preventDefault();
        togglePick(currentId, { range: e.shiftKey });
      }
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && form) { e.preventDefault(); saveCurrent(); }
      if (e.key === "j" || e.key === "k") {
        const rows = filtered();
        const idx = rows.findIndex((r) => r.traceId === currentId);
        const next = e.key === "j" ? rows[idx + 1] : rows[idx - 1];
        if (next) openTrace(next.traceId);
      }
    });

    api("/api/config").then((cfg) => {
      teacherAvailable = Boolean(cfg.propose);
      proposeEnabled = teacherAvailable;
      const toggle = $("teacher-toggle");
      const box = $("teacher-on");
      const brand = $("brand-copy");
      if (teacherAvailable && toggle && box) {
        toggle.hidden = false;
        box.checked = true;
        box.addEventListener("change", () => { setProposeEnabled(box.checked); });
        if (brand) {
          brand.textContent = "Uncheck Ask LLM to label without a teacher. Save still writes a human label.";
        }
      }
      return reload(false);
    }).catch((e) => { $("main").innerHTML = `<p class="err">${escapeHtml(e.message)}</p>`; });
  </script>
</body>
</html>
